<!DOCTYPE html>
<html>
<head>
<title>Wind Energy Prediction</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar">
    <a href="/">Home</a>
    <a href="/prediction">Prediction</a>
    <a href="/map">Map</a>
</nav>

<div class="card">

<h2>⚡ Wind Energy Prediction</h2>

<input type="text" id="city" placeholder="Enter city name">
<button onclick="getWeather()">Fetch Weather</button>

<div id="weatherBox" style="margin-top:20px;">
<p>🌡 Temperature: <span id="temperature">--</span> °C</p>
<p>💧 Humidity: <span id="humidity">--</span> %</p>
<p>🌬 Wind Speed: <span id="wind_speed">--</span> m/s</p>
<p>🧭 Wind Direction: <span id="wind_direction">--</span> °</p>
</div>

<button style="margin-top:20px;" onclick="predictPower()">
Predict Energy
</button>

<h3 id="power_result">Predicted Energy: --</h3>

<canvas id="liveChart"></canvas>

</div>

<div id="globalLoader" class="loader-overlay hidden">
    <div class="loader-spinner"></div>
</div>

<script src="{{ url_for('static', filename='js/predict.js') }}"></script>
<script src="{{ url_for('static', filename='js/transition.js') }}"></script>

</body>
</html>
